
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Not Found | Exam Seat Finder</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 520px;
        }

        .code {
            margin: 0;
            color: #2563eb;
            font-size: 100px;
            font-weight: 800;
        }

        h1 {
            margin: 10px 0;
            font-size: 30px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 13px 24px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
<main class="container">
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>
        Sorry, the page you are looking for does not exist,
        may have been moved, or is temporarily unavailable.
    </p>
    <a href="/">Back to Home</a>
</main>
</body>
</html>
